<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- README illustration: how to use the app, in three steps (share -> pick a TV -> watch).
       same card and colors as what-it-does.svg -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#1F5E8F"/>
      <stop offset="100%" stop-color="#0A2B4B"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7CB4"/>
      <stop offset="100%" stop-color="#0A2B4B"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8FC0"/>
      <stop offset="100%" stop-color="#173E63"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CC4EA"/>
      <stop offset="100%" stop-color="#2E7CB4"/>
    </linearGradient>
    <clipPath id="screen1"><rect x="136" y="142" width="148" height="298" rx="14"/></clipPath>
    <clipPath id="screen2"><rect x="526" y="142" width="148" height="298" rx="14"/></clipPath>
    <clipPath id="tv"><rect x="830" y="130" width="320" height="190" rx="14"/></clipPath>
    <clipPath id="screen3"><rect x="1077" y="274" width="76" height="164" rx="9"/></clipPath>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>

  <!-- step headings -->
  <g fill="#FFC531">
    <circle cx="210" cy="46" r="20"/>
    <circle cx="600" cy="46" r="20"/>
    <circle cx="990" cy="46" r="20"/>
  </g>
  <g font-size="22" font-weight="800" fill="#0A2B4B" text-anchor="middle">
    <text x="210" y="54">1</text>
    <text x="600" y="54">2</text>
    <text x="990" y="54">3</text>
  </g>
  <g font-size="25" font-weight="700" fill="#F7F9FB" text-anchor="middle">
    <text x="210" y="102">Share it</text>
    <text x="600" y="102">Pick a TV</text>
    <text x="990" y="102">Watch</text>
  </g>

  <!-- chevrons between steps -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 398 272 L 414 290 L 398 308"/>
    <path d="M 788 272 L 804 290 L 788 308"/>
  </g>

  <!-- 1. share from another app -->
  <rect x="125" y="125" width="170" height="330" rx="26" fill="#0B1E33" stroke="#3E5A78" stroke-width="3"/>
  <rect x="136" y="142" width="148" height="298" rx="14" fill="#F7F9FB"/>
  <g clip-path="url(#screen1)">
    <rect x="136" y="142" width="148" height="30" fill="#DDE3EA"/>
    <rect x="146" y="154" width="60" height="7" rx="3.5" fill="#9AA5B1"/>
    <rect x="146" y="182" width="128" height="72" rx="6" fill="#3A4A5C"/>
    <path d="M 202 206 L 202 230 L 222 218 Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="146" y="264" width="110" height="7" rx="3.5" fill="#C3CCD6"/>
    <rect x="146" y="278" width="80" height="7" rx="3.5" fill="#C3CCD6"/>

    <rect x="136" y="142" width="148" height="298" fill="#000000" fill-opacity="0.35"/>

    <rect x="136" y="300" width="148" height="160" rx="14" fill="#FFFFFF"/>
    <rect x="196" y="308" width="28" height="4" rx="2" fill="#C3CCD6"/>
    <text x="148" y="332" font-size="12" font-weight="700" fill="#1B2B3A">Share</text>
    <circle cx="160" cy="362" r="14" fill="#B5BEC8"/>
    <circle cx="196" cy="362" r="15" fill="url(#brand)"/>
    <rect x="188" y="355" width="16" height="11" rx="2" fill="none" stroke="#F7F9FB" stroke-width="2"/>
    <path d="M 194 358 L 194 364 L 199 361 Z" fill="#FFC531"/>
    <circle cx="232" cy="362" r="14" fill="#A7B3BF"/>
    <circle cx="268" cy="362" r="14" fill="#B5BEC8"/>
    <rect x="149" y="384" width="22" height="5" rx="2.5" fill="#D5DBE1"/>
    <text x="196" y="389" font-size="8" font-weight="700" fill="#1B2B3A" text-anchor="middle">Share to TV+</text>
    <rect x="221" y="384" width="22" height="5" rx="2.5" fill="#D5DBE1"/>
    <rect x="257" y="384" width="22" height="5" rx="2.5" fill="#D5DBE1"/>
    <g fill="#E3E8ED">
      <circle cx="160" cy="418" r="14"/>
      <circle cx="196" cy="418" r="14"/>
      <circle cx="232" cy="418" r="14"/>
      <circle cx="268" cy="418" r="14"/>
    </g>
    <circle cx="196" cy="362" r="20" fill="none" stroke="#FFC531" stroke-width="3"/>
    <circle cx="207" cy="374" r="7" fill="#FFC531" fill-opacity="0.7"/>
  </g>
  <rect x="192" y="131" width="36" height="5" rx="2.5" fill="#2A3F55"/>

  <!-- 2. pick a TV -->
  <rect x="515" y="125" width="170" height="330" rx="26" fill="#0B1E33" stroke="#3E5A78" stroke-width="3"/>
  <rect x="526" y="142" width="148" height="298" rx="14" fill="#F7F9FB"/>
  <g clip-path="url(#screen2)">
    <rect x="526" y="142" width="148" height="32" fill="#2E7CB4"/>
    <text x="600" y="163" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Share to TV+</text>

    <text x="536" y="192" font-size="10.5" font-weight="700" fill="#5B6B7C">Ready to Cast</text>
    <rect x="536" y="200" width="128" height="70" rx="7" fill="url(#thumb)"/>
    <path d="M 592 223 L 592 247 L 612 235 Z" fill="#FFC531"/>
    <rect x="542" y="256" width="30" height="10" rx="3" fill="#000000" fill-opacity="0.55"/>
    <text x="557" y="263.5" font-size="7.5" fill="#FFFFFF" text-anchor="middle">1:24</text>

    <text x="536" y="292" font-size="10.5" font-weight="700" fill="#5B6B7C">Available Devices</text>
    <rect x="532" y="300" width="136" height="34" rx="8" fill="#DCEAF7"/>
    <g fill="none" stroke="#2E7CB4" stroke-width="2">
      <rect x="540" y="309" width="20" height="13" rx="2"/>
      <rect x="540" y="347" width="20" height="13" rx="2"/>
      <rect x="540" y="385" width="20" height="13" rx="2"/>
    </g>
    <g font-size="10.5" font-weight="700" fill="#1B2B3A">
      <text x="568" y="315">Living Room</text>
      <text x="568" y="353">Bedroom</text>
      <text x="568" y="391">Kitchen</text>
    </g>
    <g font-size="8.5" fill="#6B7B8C">
      <text x="568" y="327">Fire TV</text>
      <text x="568" y="365">Google TV</text>
      <text x="568" y="403">Chromecast</text>
    </g>
    <circle cx="654" cy="317" r="12" fill="none" stroke="#FFC531" stroke-width="2" stroke-opacity="0.8"/>
    <circle cx="654" cy="317" r="6.5" fill="#FFC531" fill-opacity="0.8"/>

    <rect x="546" y="414" width="108" height="18" rx="9" fill="#1B2B3A"/>
    <text x="600" y="426" font-size="8.5" fill="#FFFFFF" text-anchor="middle">Sent to Living Room</text>
  </g>
  <rect x="582" y="131" width="36" height="5" rx="2.5" fill="#2A3F55"/>

  <!-- 3. watch on the TV, controls on the phone -->
  <g clip-path="url(#tv)">
    <rect x="830" y="130" width="320" height="190" fill="url(#sky)"/>
    <circle cx="1080" cy="182" r="22" fill="#FFC531"/>
    <path d="M 830 320 L 890 250 L 935 285 L 1010 210 L 1090 290 L 1150 250 L 1150 320 Z" fill="#1F5E8F"/>
    <path d="M 830 320 L 830 290 L 900 270 L 980 300 L 1060 275 L 1150 300 L 1150 320 Z" fill="#0A2B4B"/>
    <rect x="850" y="300" width="280" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="850" y="300" width="110" height="4" rx="2" fill="#FFC531"/>
    <circle cx="960" cy="302" r="5" fill="#FFC531"/>
  </g>
  <rect x="830" y="130" width="320" height="190" rx="14" fill="none" stroke="#F7F9FB" stroke-width="6"/>
  <rect x="985" y="323" width="10" height="8" fill="#F7F9FB"/>
  <rect x="945" y="330" width="90" height="8" rx="4" fill="#F7F9FB"/>

  <rect x="1070" y="262" width="90" height="188" rx="16" fill="#0B1E33" stroke="#3E5A78" stroke-width="3"/>
  <rect x="1077" y="274" width="76" height="164" rx="9" fill="#F7F9FB"/>
  <g clip-path="url(#screen3)">
    <rect x="1077" y="274" width="76" height="20" fill="#2E7CB4"/>
    <rect x="1084" y="304" width="52" height="5" rx="2.5" fill="#C3CCD6"/>
    <rect x="1084" y="315" width="36" height="5" rx="2.5" fill="#C3CCD6"/>
    <rect x="1077" y="332" width="76" height="106" fill="#0A2B4B"/>
    <text x="1084" y="348" font-size="7" fill="#FFFFFF" fill-opacity="0.7">Playing on</text>
    <text x="1084" y="360" font-size="8.5" font-weight="700" fill="#FFFFFF">Living Room</text>
    <rect x="1084" y="370" width="62" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="1084" y="370" width="24" height="3" rx="1.5" fill="#FFC531"/>
    <g fill="#FFFFFF">
      <path d="M 1096 386 L 1089 392 L 1096 398 Z"/>
      <path d="M 1102 386 L 1095 392 L 1102 398 Z"/>
      <rect x="1110" y="385" width="3.5" height="14" rx="1"/>
      <rect x="1117" y="385" width="3.5" height="14" rx="1"/>
      <path d="M 1128 386 L 1135 392 L 1128 398 Z"/>
      <path d="M 1134 386 L 1141 392 L 1134 398 Z"/>
      <rect x="1088" y="418" width="10" height="2.5" rx="1"/>
      <rect x="1110" y="414" width="10" height="10" rx="1.5"/>
      <rect x="1132" y="418" width="10" height="2.5" rx="1"/>
      <rect x="1135.75" y="414" width="2.5" height="10" rx="1"/>
    </g>
  </g>
  <rect x="1106" y="267" width="18" height="3" rx="1.5" fill="#2A3F55"/>

  <!-- captions -->
  <g font-size="18" fill="#D6E3EF" text-anchor="middle">
    <text x="210" y="496">In any app, tap Share</text>
    <text x="210" y="520">and pick Share to TV+</text>
    <text x="600" y="496">It finds the video, then</text>
    <text x="600" y="520">tap your TV to send it</text>
    <text x="990" y="496">It plays on the TV. Pause, seek</text>
    <text x="990" y="520">or stop it from your phone</text>
  </g>
</svg>
